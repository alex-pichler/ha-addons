---
name: Claude Window Keeper
version: "0.1.1"
slug: claude_window
description: >-
  Pings Claude on a rolling schedule so a subscription usage window is always open.
url: https://github.com/alex-pichler/claude-window
image: ghcr.io/alex-pichler/claude-window
arch:
  - aarch64
init: false
startup: services
homeassistant_api: true
options:
  oauth_token: ""
  window_hours: 5
  margin_minutes: 5
  keepalive: false
  daily_primes:
    - "08:00"
    - "13:00"
    - "18:00"
    - "23:00"
  weekdays_only: false
  prompt: "ok"
  model: haiku
schema:
  oauth_token: password
  window_hours: float(1,12)
  margin_minutes: int(0,120)
  keepalive: bool
  daily_primes:
    - match(^([01][0-9]|2[0-3]):[0-5][0-9]$)
  weekdays_only: bool
  prompt: str
  model: list(haiku|sonnet|opus)
