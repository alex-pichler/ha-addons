version: "1.5.0"
slug: jim-mcp
name: Jim MCP
description: "Jim MCP server"
arch:
  - aarch64
image: "ghcr.io/alex-pichler/jim-mcp"
init: false
ports:
  8000/tcp: 8000
environment:
  # source-IP allowlist (jim >= 1.3.1): alex-pc, devbox-1, loopback, and the
  # Supervisor network (WireGuard add-on forwards the Pangolin tunnel from there)
  JIM_ALLOWED_CIDRS: "127.0.0.1/32,192.168.0.200/32,192.168.0.201/32,172.30.32.0/23"
